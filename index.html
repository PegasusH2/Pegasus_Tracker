<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Pegasus Tracker</title>

  <meta name="theme-color" content="#F2F2F5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Diario personal de entrenamiento y seguimiento de progreso físico" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="Pegasus" />

<body>
  <!-- Splash de arranque — visible desde el primer pintado (markup estático,
       no espera a que cargue ningún JS), mismo look que la pantalla de
       bienvenida del onboarding (.brand-splash, ver js/views/onboarding.js)
       para mantener una única identidad de marca. js/app.js la mantiene
       visible un mínimo de 2s y luego la retira con un fundido. -->
  <div id="app-splash" class="onboarding-screen brand-splash">
    <div class="onboarding-body brand-intro">
      <!-- El icono original (icons/icon-512.png) lleva su fondo negro
           incrustado en el propio PNG — aquí en cambio se recompone en dos
           capas SIN caja negra: la silueta del caballo como máscara CSS
           (adopta var(--text), se ve bien en cualquier tema) + la banda roja
           como imagen normal (icons/icon-mono-stripe.png, siempre el rojo de
           marca). Ver #app-splash .brand-logo* en css/layout.css. -->
      <div class="brand-logo" role="img" aria-label="Pegasus Tracker">
        <span class="brand-logo-mono"></span>
        <img class="brand-logo-stripe" src="icons/icon-mono-stripe.png" alt="" />
      </div>
      <div class="brand-wordmark">PEGASUS</div>
      <!-- El lema normal (todos los temas salvo Queens, ver css/layout.css) -->
      <p class="brand-tagline">TRAIN <span class="brand-dot">&bull;</span> TRACK <span class="brand-dot">&bull;</span> PROGRESS</p>
      <!-- Firma "4 the Queens" — SOLO con ese tema, sustituye al lema en el
           mismo sitio (misma posición en los 3 temas, ver css/layout.css).
           10 trazados reales (uno por letra, extraídos una vez de Dancing
           Script Semibold con fontTools — ver docs/ si hace falta
           regenerarlos), cada uno YA con relleno sólido (nunca hueco) y
           revelado con clip-path (barato de animar, nada de
           stroke-dasharray sobre curvas complejas, que iba a tirones). Cada
           letra tiene su propio animation-delay para que aparezcan en
           orden, de izquierda a derecha. Última letra termina a los
           1.49s — MIN_QUEENS_SPLASH_MS en js/app.js se asegura de
           que el splash nunca se retire antes de que esto termine. -->
